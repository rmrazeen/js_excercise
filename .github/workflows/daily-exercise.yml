name: Daily JS Exercise Release

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Find and release next file
        run: |
          set -e
          
          # Fetch staged branch
          git fetch origin staged
          
          # Find files in staged that don't exist in main
          files=$(git ls-tree -r --name-only origin/staged -- js_excercise/ | while read file; do
            if [ ! -f "$file" ]; then
              echo "$file"
            fi
          done | sort | head -1)
          
          if [ -z "$files" ]; then
            echo "🎉 All exercises have been released!"
            exit 0
          fi
          
          echo "🚀 Releasing: $files"
          
          # Create directory if needed
          mkdir -p "$(dirname "$files")"
          
          # Get file content from staged branch
          git show "origin/staged:$files" > "$files"
          
          # Commit and push
          git add "$files"
          git commit -m "🎯 Daily Exercise: $(basename "$files")

          Released: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          From: staged → main"
          
          git push origin main
          
          echo "✅ Successfully released: $files"
